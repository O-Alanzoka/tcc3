<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bellievie · Solicitar viagem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="viagem.css">

</head>

<body>
    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <strong>BELLIEVIE</strong>
                <span>REPRESENTANTE</span>
            </div>
            <nav class="menu" id="menu">
                <a href="dashboarda.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 2.5h11v11h-11zM2.5 8h11M8 2.5v11"/></svg> Dashboard
                </a>
                <a href="eventos.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 2.5h11v11h-11zM2.5 6h11M2.5 9.5h11"/></svg> Eventos
                </a>
                <a href="relatorio.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11zM8 3.5v9"/></svg> Relatórios
                </a>
                <a href="calendario.html" class="gap">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 3h10v10H3z"/></svg> Calendário
                </a>
                <a href="viagem.html" class="active" aria-current="page">
                    <svg width="20" height="20" viewBox="0 0 24 24" class="fill"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg> Viagens
                </a>
                <a href="visitas.html" class="">
                    <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11zM8 3.5v9"/></svg> visitas
                </a>
                <hr>
            </nav>
            <div class="profile">
                <div class="photo">
                    <svg width="36" height="36" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#8d9a94"/><circle cx="16" cy="12.5" r="5.5" fill="#1b2b24"/><path d="M5.5 27c1.5-6 5.5-8 10.5-8s9 2 10.5 8c-3 3-6.5 4.5-10.5 4.5S8.5 30 5.5 27z" fill="#1b2b24"/></svg>
                </div>
                <div>
                    <b>Representante</b>
                    <small>Usuário corporativo</small>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO -->
        <main class="main">

            <div class="title">
                <h1>Solicitar viagem</h1>
            </div>
            <form class="card" id="f">
                <h2>Dados da viagem</h2>
                <div class="grid3">
                    <div class="f"><label for="origem">Origem</label><input id="origem" placeholder="Inserir" required></div>
                    <div class="f"><label for="destino">Destino</label><input id="destino" placeholder="Inserir" required></div>
                    <div class="f"><label for="ida">Ida</label><input id="ida" type="date" required></div>
                    <div class="f"><label for="volta">Volta</label><input id="volta" type="date"></div>
                    <div class="f"><label for="transp">Transporte</label><select id="transp"><option>Aéreo</option><option>Rodoviário</option><option>Carro próprio</option><option>Carro alugado</option></select></div>
                    <div class="f"><label for="hosp">Hospedagem</label><select id="hosp"><option>Sim</option><option>Não</option></select></div>
                    <div class="f span3"><label for="motivo">Motivo</label><input id="motivo" placeholder="Inserir"></div>
                </div>
                <div class="mid">
                    <div class="f"><label for="obs">Observações</label><textarea id="obs" placeholder="Informações adicionais, preferências e justificativas..."></textarea></div>
                    <label class="drop" for="comp" id="lc">COMPROVANTE / CONVITE DO EVENTO</label>
                    <input id="comp" type="file" accept="image/*,.pdf" hidden>
                </div>
                <div class="custos">
                    <h3>Estimativa de custos</h3>
                    <span>Passagem</span><b>R$ 0</b>
                    <div class="total"><b>Total estimado</b><strong id="tot">R$ 0</strong></div>
                    <span>Hospedagem</span><b>R$ 0</b>
                    <span>Transporte local</span><b>R$ 0</b>
                </div>
                <div class="actions">
                    <button class="btn light" type="button" id="rasc">Salvar rascunho</button>
                    <button class="btn" type="submit">Enviar solicitação</button>
                </div>
            </form>
        </main>
    </div>
    <script>
        document.getElementById('comp').addEventListener('change', e => {
            if (e.target.files[0]) document.getElementById('lc').textContent = e.target.files[0].name;
        });
        document.getElementById('rasc').onclick = () => alert('Rascunho salvo (protótipo)');
        document.getElementById('f').addEventListener('submit', e => {
            e.preventDefault();
            alert('Solicitação enviada (protótipo)');
        });
    </script>
</body>

</html>
